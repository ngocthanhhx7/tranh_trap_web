server {
    listen 80;
    server_name tranhtrap.com.vn www.tranhtrap.com.vn;
    root /var/www/tranhtrap/current;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://pay.payos.vn; frame-ancestors 'none'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
    location ~ /\. { deny all; }
    location ~* \.(env|pem|key|map|ts|tsx)$ { return 404; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /images/ { try_files $uri =404; expires 7d; }
    location /fonts/ { try_files $uri =404; expires 30d; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
